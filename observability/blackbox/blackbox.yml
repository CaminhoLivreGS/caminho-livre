# Blackbox Exporter: sondas HTTP(S) de caixa-preta.
modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: []        # vazio = qualquer 2xx
      follow_redirects: true
      preferred_ip_protocol: ip4
      # Cabeçalho para identificar as sondas nos logs do App Service.
      headers:
        User-Agent: caminho-livre-blackbox
