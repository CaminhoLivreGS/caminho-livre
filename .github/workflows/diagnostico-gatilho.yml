# Diagnóstico temporário: verifica se eventos push/pull_request disparam o Actions.
# Será removido após o teste.
name: Diagnostico de gatilho
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  eco:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "evento=${{ github.event_name }} ref=${{ github.ref }}"
