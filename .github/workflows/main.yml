# =============================================================================
# Caminho Livre - Pipeline DevSecOps (CI/CD)
#
#   push (qualquer branch) / PR para main
#        │
#        ├── test ──────────┐   testes unitários + build do Vite
#        ├── terraform ─────┤   IaC: fmt + validate
#        ├── observabilidade┤   Prometheus: config + testes de alerta
#        ├── gitleaks ──────┤   segredos no histórico git
#        ├── semgrep ───────┤   SAST (risco ALTO/CRÍTICO bloqueia)
#        └── trivy ─────────┤   CVEs HIGH/CRITICAL na imagem + IaC (bloqueia)
#                           ▼
#                     security-gate   aprova/bloqueia (roda em toda branch)
#                           ▼
#                        deploy       só push na main: ACR + Azure Web App
#
# Credenciais: GitHub Secrets + OIDC (sem senha de longa duração).
#   secrets.AZURE_CLIENT_ID, secrets.AZURE_TENANT_ID, secrets.AZURE_SUBSCRIPTION_ID
#   vars.AZURE_ACR_NAME, vars.AZURE_WEBAPP_NAME, vars.AZURE_RESOURCE_GROUP
#
# Todas as Actions de terceiros estão fixadas por SHA de commit (proteção de
# cadeia de suprimentos); o comentário ao lado indica a versão.
# =============================================================================
name: CI/CD DevSecOps

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Menor privilégio: cada job pede só o que precisa.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Nunca cancela um deploy em andamento na main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE_NAME: caminho-livre
  NODE_VERSION: "22"
  GITLEAKS_VERSION: "8.30.1"
  TRIVY_VERSION: "v0.71.1"
  SEMGREP_RULESETS: >-
    --config p/javascript
    --config p/react
    --config p/secrets
    --config p/dockerfile
    --config p/nginx
    --config p/terraform

jobs:
  # ---------------------------------------------------------------------------
  # Qualidade: testes unitários do núcleo de visão + build de produção
  # ---------------------------------------------------------------------------
  test:
    name: Testes e build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Baixar OpenCV.js e Haar Cascades (SHA-256 conferido)
        run: npm run deps

      - name: Testes unitários
        run: npm test

      - name: Build de produção
        run: npm run build

  # ---------------------------------------------------------------------------
  # IaC: formatação e validação do Terraform (sem backend e sem credenciais)
  # ---------------------------------------------------------------------------
  terraform:
    name: "IaC: Terraform (fmt + validate)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - name: Formatação
        run: terraform fmt -check -recursive -diff

      - name: Init (sem backend remoto)
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate
        run: terraform validate

  # ---------------------------------------------------------------------------
  # Observabilidade: config do Prometheus, regras e testes unitários de alerta
  # ---------------------------------------------------------------------------
  observabilidade:
    name: "Observabilidade: Prometheus (config + testes de alerta)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: promtool check config / check rules / test rules
        run: |
          set -euo pipefail
          # Mesma versão do docker-compose; caminhos iguais aos do container.
          docker run --rm --entrypoint sh \
            -v "$PWD/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.16.0 -c '
              promtool check config /etc/prometheus/prometheus.yml &&
              promtool check rules /etc/prometheus/regras/alertas.yml &&
              cd /etc/prometheus/testes && promtool test rules alertas.test.yml'

      - name: Dashboard do Grafana é JSON válido
        run: python3 -m json.tool observability/grafana/provisioning/dashboards/json/metricas-de-ouro.json > /dev/null

  # ---------------------------------------------------------------------------
  # Segurança 1/3 - Gitleaks: segredos em todo o histórico
  # ---------------------------------------------------------------------------
  gitleaks:
    name: "Segurança: Gitleaks (segredos)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0              # histórico completo: segredo apagado ainda conta
          persist-credentials: false

      - name: Instalar Gitleaks (binário oficial, checksum conferido)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          arquivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${arquivo}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${arquivo}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${arquivo}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Varredura de segredos
        run: |
          gitleaks git . \
            --redact \
            --no-banner \
            --verbose \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Publicar relatório (evidência)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-gitleaks
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 30

      # Code Scanning: grátis em repo público; em privado exige GitHub Advanced
      # Security, por isso não derruba o job se indisponível.
      - name: Enviar ao GitHub Code Scanning
        if: always() && hashFiles('gitleaks.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # ---------------------------------------------------------------------------
  # Segurança 2/3 - Semgrep: análise estática (SAST)
  # ---------------------------------------------------------------------------
  semgrep:
    name: "Segurança: Semgrep (SAST)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.166.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Análise estática
        # O scan só gera os relatórios; quem decide o bloqueio é o gate abaixo.
        # SEMGREP_RULESETS é um valor fixo deste arquivo (sem entrada externa).
        run: |
          # shellcheck disable=SC2086
          semgrep scan $SEMGREP_RULESETS \
            --metrics=off \
            --exclude node_modules --exclude public --exclude dataset \
            --json-output=semgrep.json \
            --sarif-output=semgrep.sarif \
            .

      - name: Gate (bloqueia risco ALTO/CRÍTICO)
        run: python3 .github/scripts/semgrep_gate.py semgrep.json

      - name: Publicar relatório (evidência)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-semgrep
          path: |
            semgrep.json
            semgrep.sarif
          if-no-files-found: ignore
          retention-days: 30

      - name: Enviar ao GitHub Code Scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ---------------------------------------------------------------------------
  # Segurança 3/3 - Trivy: imagem Docker (CVEs) + IaC (misconfigurações)
  # A imagem escaneada é a MESMA que vai para o ACR (passada por artefato).
  # ---------------------------------------------------------------------------
  trivy:
    name: "Segurança: Trivy (imagem + IaC)"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build da imagem (sem push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verificar usuário non-root
        env:
          IMAGEM: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          usuario="$(docker image inspect "$IMAGEM" --format '{{.Config.User}}')"
          echo "Usuário da imagem: '${usuario}'"
          if [ -z "$usuario" ] || [ "$usuario" = "root" ] || [ "$usuario" = "0" ]; then
            echo "::error::A imagem roda como root. Defina USER non-root no Dockerfile."
            exit 1
          fi

      - name: Misconfigurações (Dockerfile e Terraform)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: .
          skip-dirs: node_modules
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore   # riscos aceitos, com justificativa
          exit-code: "1"
          hide-progress: true

      - name: Vulnerabilidades da imagem (bloqueia HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          # Só CVEs com correção disponível bloqueiam: as demais não têm ação
          # possível para o time e ficam registradas no relatório SARIF.
          ignore-unfixed: true
          exit-code: "1"
          format: table
          hide-progress: true

      - name: Relatório SARIF da imagem (evidência)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: LOW,MEDIUM,HIGH,CRITICAL
          format: sarif
          output: trivy-imagem.sarif
          exit-code: "0"
          hide-progress: true

      - name: Publicar relatório (evidência)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-trivy
          path: trivy-imagem.sarif
          if-no-files-found: ignore
          retention-days: 30

      - name: Enviar ao GitHub Code Scanning
        if: always() && hashFiles('trivy-imagem.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-imagem.sarif
          category: trivy-imagem

      # Só a main faz deploy: nas demais branches não vale guardar a imagem.
      - name: Exportar imagem aprovada para o deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGEM: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: docker save "$IMAGEM" | gzip > imagem.tar.gz

      - name: Guardar imagem como artefato
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imagem-docker
          path: imagem.tar.gz
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Gate: consolida o resultado. Use-o como "required status check" na
  # proteção da branch main para que nada vulnerável seja mesclado.
  # ---------------------------------------------------------------------------
  security-gate:
    name: "Gate de segurança"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [test, terraform, observabilidade, gitleaks, semgrep, trivy]
    if: always()
    steps:
      - name: Avaliar resultados
        env:
          TEST: ${{ needs.test.result }}
          TERRAFORM: ${{ needs.terraform.result }}
          OBSERVABILIDADE: ${{ needs.observabilidade.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}
          SEMGREP: ${{ needs.semgrep.result }}
          TRIVY: ${{ needs.trivy.result }}
        run: |
          icone() { [ "$1" = "success" ] && echo "✅ aprovado" || echo "❌ $1"; }
          {
            echo "## Gate de segurança"
            echo ""
            echo "| Verificação | Resultado |"
            echo "|---|---|"
            echo "| Testes e build | $(icone "$TEST") |"
            echo "| Terraform (fmt + validate) | $(icone "$TERRAFORM") |"
            echo "| Observabilidade (Prometheus) | $(icone "$OBSERVABILIDADE") |"
            echo "| Gitleaks (segredos) | $(icone "$GITLEAKS") |"
            echo "| Semgrep (SAST) | $(icone "$SEMGREP") |"
            echo "| Trivy (imagem + IaC) | $(icone "$TRIVY") |"
          } >> "$GITHUB_STEP_SUMMARY"

          for r in "$TEST" "$TERRAFORM" "$OBSERVABILIDADE" "$GITLEAKS" "$SEMGREP" "$TRIVY"; do
            if [ "$r" != "success" ]; then
              echo "**🚫 DEPLOY BLOQUEADO:** corrija os achados acima." >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Gate de segurança reprovado. Deploy bloqueado."
              exit 1
            fi
          done
          echo "**✅ Liberado para deploy.**" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Deploy: push no ACR + atualização do Azure Web App for Containers.
  # Só roda em push na main e só se o gate aprovar.
  # ---------------------------------------------------------------------------
  deploy:
    name: "Deploy (Azure)"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [security-gate]
    # Fica "skipped" até a infra existir (vars.AZURE_WEBAPP_NAME cadastrada).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    permissions:
      contents: read
      id-token: write                 # OIDC com o Microsoft Entra ID
    environment:
      name: production
      url: ${{ steps.smoke.outputs.url }}
    env:
      ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - name: Conferir configuração
        run: |
          faltando=""
          [ -n "$ACR_NAME" ] || faltando="$faltando AZURE_ACR_NAME"
          [ -n "$WEBAPP_NAME" ] || faltando="$faltando AZURE_WEBAPP_NAME"
          [ -n "$RESOURCE_GROUP" ] || faltando="$faltando AZURE_RESOURCE_GROUP"
          if [ -n "$faltando" ]; then
            echo "::error::Variáveis do repositório ausentes:$faltando"
            exit 1
          fi

      - name: Baixar imagem aprovada
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: imagem-docker

      - name: Carregar imagem
        run: gunzip -c imagem.tar.gz | docker load

      - name: Login no Azure (OIDC, sem senha)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push para o Azure Container Registry
        id: push
        env:
          IMAGEM_LOCAL: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"
          servidor="$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)"
          # Tag imutável = SHA do commit (rastreabilidade e rollback).
          destino="${servidor}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker tag "$IMAGEM_LOCAL" "$destino"
          docker push "$destino"
          echo "imagem=${destino}" >> "$GITHUB_OUTPUT"

      - name: Deploy no Azure Web App
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          resource-group-name: ${{ env.RESOURCE_GROUP }}
          images: ${{ steps.push.outputs.imagem }}

      - name: Smoke test (/healthz)
        id: smoke
        run: |
          set -euo pipefail
          host="$(az webapp show --name "$WEBAPP_NAME" --resource-group "$RESOURCE_GROUP" --query defaultHostName -o tsv)"
          url="https://${host}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          for tentativa in $(seq 1 20); do
            if curl -fsS --max-time 10 "${url}/healthz" >/dev/null; then
              echo "✅ Aplicação no ar: ${url}" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Tentativa ${tentativa}/20: aguardando o container subir..."
            sleep 15
          done
          echo "::error::A aplicação não respondeu em ${url}/healthz"
          exit 1

      - name: Logout do Azure
        if: always()
        run: az logout || true
