# Caminho Livre - nginx (imagem nginx-unprivileged, roda como UID 101).
# O nginx.conf da imagem base já usa pid e temp paths em /tmp, o que permite
# rodar com sistema de arquivos read-only + tmpfs em /tmp.

# Log em JSON com tempo de resposta: base para Latência/Tráfego/Erros
# (Métricas de Ouro) em qualquer coletor de logs.
log_format json_metricas escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
  '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"request_time":$request_time,"user_agent":"$http_user_agent"}';

# ---------------------------------------------------------------------------
# Aplicação (porta pública do container)
# ---------------------------------------------------------------------------
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  access_log /dev/stdout json_metricas;
  error_log  /dev/stderr warn;

  server_tokens off;          # não expõe a versão do nginx
  client_max_body_size 1m;    # site estático: não recebe uploads

  # Compressão: o bundle do OpenCV (~10 MB) cai para ~3,3 MB com gzip.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml application/wasm;

  # Probe de saúde (Docker HEALTHCHECK e Azure App Service Health Check).
  location = /healthz {
    access_log off;
    default_type text/plain;
    include /etc/nginx/snippets/security-headers.conf;
    return 200 "ok\n";
  }

  # Assets com hash no nome (Vite): cache longo e imutável.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Haar Cascades da LGPD (sem hash no nome): cache moderado.
  location ^~ /cascades/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # Bloqueia arquivos ocultos (.env, .git etc.), por defesa em profundidade.
  location ~ /\. {
    deny all;
    return 404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;   # index.html sempre revalidado
    try_files $uri $uri/ /index.html;
  }
}

# ---------------------------------------------------------------------------
# Métricas internas (stub_status) para o nginx-prometheus-exporter.
# Não é publicada no Azure (o App Service só encaminha a porta 8080) e aceita
# apenas loopback e redes privadas (rede interna do docker compose).
# ---------------------------------------------------------------------------
server {
  listen 8081;
  server_name _;
  access_log off;

  location = /stub_status {
    stub_status;
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
  }

  location / {
    return 404;
  }
}
