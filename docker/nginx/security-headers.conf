# Headers de segurança, incluídos em cada location (no nginx, um add_header
# dentro de location descarta os herdados do server; por isso o include).
#
# CSP:
#  - sem 'unsafe-inline' em script-src (principal defesa contra XSS);
#  - 'unsafe-eval' é necessário: o OpenCV.js (Emscripten/embind) cria funções
#    com `new Function`, no Web Worker e no fallback da thread principal.
#    Trade-off documentado; sem ele a visão computacional não carrega.
#  - blob:/data: em img-src: preview da foto (URL.createObjectURL) e canvas.
#  - connect-src 'self': verificado no Chrome que o worker de visão (OpenCV do
#    pacote npm, empacotado pelo Vite) inicia, baixa os Haar Cascades e analisa
#    uma foto sem violações. O opencv.js de public/opencv/ (só usado pelo
#    avaliacao.html, ferramenta de dev) exigiria data: e fica fora da imagem.
#    O futuro backend de denúncias deve ficar no mesmo domínio (ou ser
#    adicionado aqui explicitamente).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; worker-src 'self' blob:; img-src 'self' blob: data:; style-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# A câmera só pode ser usada pela própria origem; o resto fica desligado.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(), usb=()" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# HSTS: o TLS termina no Azure App Service; o header é respeitado só via HTTPS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
