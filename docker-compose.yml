# =============================================================================
# Caminho Livre - stack local
#
#   docker compose up --build -d                          # só a aplicação
#   docker compose --profile observability up --build -d  # + Prometheus/Grafana
#
# Todas as portas ficam presas em 127.0.0.1 (nada exposto na rede local).
# A câmera exige contexto seguro; http://localhost já é considerado seguro.
# Segredos (ex.: senha do Grafana) vêm do arquivo .env, que NÃO é versionado.
# Os arquivos de observability/ são entregues no passo de Observabilidade.
# =============================================================================

name: caminho-livre

# Hardening comum a todos os serviços.
x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # ---------------------------------------------------------------------------
  # Aplicação: SPA + OpenCV.js servida por nginx non-root
  # ---------------------------------------------------------------------------
  app:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile
    image: caminho-livre:local
    container_name: caminho-livre-app
    user: "101:101"                 # reforça o non-root definido no Dockerfile
    read_only: true                 # FS imutável; nginx escreve só em /tmp
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "127.0.0.1:8080:8080"       # aplicação (stub_status 8081 fica interno)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [frontend, monitoring]

  # ---------------------------------------------------------------------------
  # Observabilidade (profile opcional)
  # ---------------------------------------------------------------------------
  nginx-exporter:
    <<: *hardening
    profiles: [observability]
    image: nginx/nginx-prometheus-exporter:1.4.0
    container_name: caminho-livre-nginx-exporter
    command:
      - --nginx.scrape-uri=http://app:8081/stub_status
    read_only: true
    depends_on:
      app:
        condition: service_healthy
    networks: [monitoring]          # sem porta publicada: só o Prometheus acessa

  prometheus:
    <<: *hardening
    profiles: [observability]
    image: prom/prometheus:v3.1.0
    container_name: caminho-livre-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    read_only: true
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [nginx-exporter]
    # frontend: porta publicada + saída para consultar a URL do Azure
    networks: [frontend, monitoring]

  grafana:
    <<: *hardening
    profiles: [observability]
    image: grafana/grafana:11.4.0
    container_name: caminho-livre-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      # Obrigatória: o compose falha se não estiver definida no .env.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?defina GF_ADMIN_PASSWORD no .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    networks: [frontend, monitoring]

networks:
  frontend:
  monitoring:
    internal: true                  # stub_status e exporter sem saída para a internet

volumes:
  prometheus-data:
  grafana-data:
