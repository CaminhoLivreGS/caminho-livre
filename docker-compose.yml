# =============================================================================
# Caminho Livre - stack local
#
#   docker compose up --build -d                          # só a aplicação
#   docker compose --profile observability up --build -d  # + Prometheus/Grafana
#
# Todas as portas ficam presas em 127.0.0.1 (nada exposto na rede local).
# A câmera exige contexto seguro; http://localhost já é considerado seguro.
# A senha do Grafana é um Docker secret (observability/grafana/admin-password, fora do git).
# Para sondar a URL do Azure: sh infra/scripts/configurar-observabilidade.sh
# =============================================================================

name: caminho-livre

# Hardening comum a todos os serviços.
x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # ---------------------------------------------------------------------------
  # Aplicação: SPA + OpenCV.js servida por nginx non-root
  # ---------------------------------------------------------------------------
  app:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile
    image: caminho-livre:local
    container_name: caminho-livre-app
    user: "101:101"                 # reforça o non-root definido no Dockerfile
    read_only: true                 # FS imutável; nginx escreve só em /tmp
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "127.0.0.1:8080:8080"       # aplicação (stub_status 8081 fica interno)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [frontend, monitoring]

  # ---------------------------------------------------------------------------
  # Observabilidade (profile opcional): Métricas de Ouro
  # ---------------------------------------------------------------------------
  nginx-exporter:
    <<: *hardening
    profiles: [observability]
    image: nginx/nginx-prometheus-exporter:1.5.3
    container_name: caminho-livre-nginx-exporter
    command:
      - --nginx.scrape-uri=http://app:8081/stub_status
    read_only: true
    depends_on:
      app:
        condition: service_healthy
    networks: [monitoring]          # sem porta publicada: só o Prometheus acessa

  blackbox:
    <<: *hardening
    profiles: [observability]
    image: prom/blackbox-exporter:v0.29.1
    container_name: caminho-livre-blackbox
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    read_only: true
    volumes:
      - ./observability/blackbox:/etc/blackbox:ro
    # frontend: saída para sondar a URL pública no Azure; sem porta publicada.
    networks: [frontend, monitoring]

  prometheus:
    <<: *hardening
    profiles: [observability]
    image: prom/prometheus:v3.16.0
    container_name: caminho-livre-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    read_only: true
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [nginx-exporter, blackbox]
    networks: [frontend, monitoring]

  grafana:
    <<: *hardening
    profiles: [observability]
    image: grafana/grafana:13.3.1
    container_name: caminho-livre-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      # Senha via Docker secret (arquivo fora do git), nunca em variável/código.
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/metricas-de-ouro.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    secrets: [grafana_admin_password]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    networks: [frontend, monitoring]

secrets:
  # Crie antes de subir a observabilidade (o arquivo é ignorado pelo git):
  #   openssl rand -base64 24 > observability/grafana/admin-password
  grafana_admin_password:
    file: ./observability/grafana/admin-password

networks:
  frontend:
  monitoring:
    internal: true                  # stub_status e exporter sem saída para a internet

volumes:
  prometheus-data:
  grafana-data:
